<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>{{FULL_NAME}} — {{DOMAIN}}</title>
    <meta
      name="description"
      content="{{DOMAIN}} is reserved for {{FULL_NAME}}. There is no site here yet — the name is simply being held."
    />
    <link rel="canonical" href="https://www.{{DOMAIN}}/" />
    <meta name="theme-color" content="#f7f5f1" />
    <meta name="robots" content="noindex, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.{{DOMAIN}}/" />
    <meta property="og:title" content="{{FULL_NAME}} — {{DOMAIN}}" />
    <meta
      property="og:description"
      content="Reserved for {{FULL_NAME}}. There is no site here yet."
    />
    <meta name="twitter:card" content="summary" />

    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body
    class="bg-paper text-ink font-sans antialiased selection:bg-ink selection:text-paper"
  >
    <!-- A single centred card. No navigation, no links out except the holder
         credit, and nothing that needs JavaScript to paint. -->
    <main class="grid min-h-dvh place-items-center px-5 py-12 sm:px-6">
      <div class="w-full max-w-xl">
        <div
          class="rounded-2xl border border-rule bg-card px-7 py-12 text-center shadow-card sm:px-12 sm:py-16"
        >
          <p class="eyebrow">{{DOMAIN}}</p>

          <h1
            class="mt-6 font-display text-3xl leading-tight font-normal tracking-tight text-balance sm:text-4xl"
          >
            This domain is reserved for
            <span class="mt-2 block font-medium">{{FULL_NAME}}</span>
          </h1>

          <div class="mx-auto mt-9 h-px w-16 bg-rule" role="presentation"></div>

          <p
            class="mx-auto mt-8 max-w-sm text-[0.9375rem] leading-relaxed text-pretty text-ink-soft"
          >
            There is no site here yet. The name is simply being held, waiting
            for something worth putting on it.
          </p>
        </div>

        <p class="mt-7 text-center text-xs tracking-wide text-ink-faint">
          Held by
          <a
            class="underline decoration-rule underline-offset-4 transition-colors hover:text-ink hover:decoration-ink-faint"
            href="https://www.brandonmartinez.com/"
            >Brandon Martinez</a
          >
        </p>
      </div>
    </main>
  </body>
</html>
